[project]
name = "marker-expression"
version = "0.1.0"
description = "Lineage-level percent expression from CELLxGENE Census (Domínguez Conde pan-immune atlas)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cellxgene-census>=1.15.0",
    "tiledbsoma>=1.14.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
